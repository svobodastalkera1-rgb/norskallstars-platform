name: Pending client gates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android checks — pending
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/pending_gate.py android
