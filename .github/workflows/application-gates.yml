name: Android CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Android quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 scripts/android_jdk.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: jdkfile
          # SemVer cache label; the archive and installed binary are pinned to 17.0.20.1.
          java-version: '17.0.20'
          jdkFile: ${{ runner.temp }}/microsoft-jdk-17.0.20.1-linux-x64.tar.gz
      - run: python3 scripts/android_jdk.py --verify
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: python3 scripts/android.py wrapper
      - run: python3 scripts/android_contract.py --check
      - run: python3 scripts/android.py check
  build:
    name: Android build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 scripts/android_jdk.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: jdkfile
          # SemVer cache label; the archive and installed binary are pinned to 17.0.20.1.
          java-version: '17.0.20'
          jdkFile: ${{ runner.temp }}/microsoft-jdk-17.0.20.1-linux-x64.tar.gz
      - run: python3 scripts/android_jdk.py --verify
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: python3 scripts/android.py build
      # No APK, signing credentials, screenshots or private reports are published.
  audit:
    name: Android dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 scripts/android_audit.py
  device:
    name: Android device tests (API ${{ matrix.api }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 scripts/android_jdk.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: jdkfile
          # SemVer cache label; the archive and installed binary are pinned to 17.0.20.1.
          java-version: '17.0.20'
          jdkFile: ${{ runner.temp }}/microsoft-jdk-17.0.20.1-linux-x64.tar.gz
      - run: python3 scripts/android_jdk.py --verify
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.12.23
          enable-cache: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - id: local-environment
        run: python3 scripts/phase1.py init
      - run: python3 scripts/android_e2e.py prepare
      - name: Start isolated Android test backend
        run: |
          mkdir -p .cache/android-e2e
          python3 scripts/android_e2e.py serve > .cache/android-e2e/backend.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8001/health/ready > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Prepare device test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PdevelopmentOrigin=http://10.0.2.2:8001 --no-daemon
        working-directory: apps/android
      - name: Allow runner access to its KVM device
        run: sudo chown "$USER" /dev/kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -idle-grpc-timeout 3600 -memory 1536 -cores 2
          script: |
            adb install -r apps/android/app/build/outputs/apk/debug/app-debug.apk
            python3 scripts/android_e2e.py device-input
            python3 scripts/android.py device
      - if: always() && steps.local-environment.outcome == 'success'
        run: python3 scripts/phase1.py down
