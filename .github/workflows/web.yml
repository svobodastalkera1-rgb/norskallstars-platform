name: Web CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Web quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0
      - run: npm ci --ignore-scripts
        working-directory: apps/web
      - run: npm run format && npm run lint && npm run build && npm run contracts
        working-directory: apps/web
      - run: git diff --exit-code -- apps/web/src/identity.generated.ts apps/web/src/learning.generated.ts apps/web/src/media.generated.ts
  tests:
    name: Web tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.12.23
          enable-cache: false
      - name: Install locked Web dependencies
        run: npm ci --ignore-scripts
        timeout-minutes: 5
        working-directory: apps/web
      - name: Run Web unit and component tests
        run: npm run test
        timeout-minutes: 3
        working-directory: apps/web
      - name: Build browser test client
        run: npm run build
        timeout-minutes: 3
        working-directory: apps/web
      - name: Bound system dependency download retries
        run: |
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/99-norskallstars-ci-network > /dev/null
      - name: Install browser engines and system dependencies
        run: npx playwright install --with-deps chromium firefox webkit
        timeout-minutes: 8
        working-directory: apps/web
      - run: python3 scripts/phase1.py init
      - name: Run all isolated browser integration projects
        run: make web-e2e
        timeout-minutes: 5
      - if: always()
        run: python3 scripts/phase1.py down
      # No private browser trace, video, screenshot, credential or report artifacts.
  dependencies:
    name: Web dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0
      - run: npm ci --ignore-scripts && npm audit --audit-level=low
        working-directory: apps/web
