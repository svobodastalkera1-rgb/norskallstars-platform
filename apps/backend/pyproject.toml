[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "norskallstars-backend"
version = "0.1.0"
description = "NorskAllstars Platform backend infrastructure"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.142.2,<0.143",
  "uvicorn>=0.54.0,<0.55",
  "sqlalchemy[asyncio]>=2.1.3,<2.2",
  "alembic>=1.20.0,<1.21",
  "pydantic>=2.13.5,<2.14",
  "pydantic-settings>=2.15.0,<2.16",
  "psycopg[binary]>=3.3.6,<3.4",
  "jsonschema>=4.26,<5",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1,<9.2",
  "pytest-asyncio>=1.4.0,<1.5",
  "httpx2>=2.13.1,<2.14",
  "ruff>=0.16.10,<0.17",
  "mypy>=2.4.0,<2.5",
  "pip-audit>=2.10.1,<2.11",
  "types-jsonschema>=4.26.0.20260518",
]

[tool.hatch.build.targets.wheel]
packages = ["src/norskallstars_backend"]

[tool.hatch.build.targets.wheel.force-include]
"../../contracts/course-package/upstream/specification" = "norskallstars_backend/_contract/specification"
"../../contracts/course-package/upstream/tools/course_package.py" = "norskallstars_backend/_contract/tools/course_package.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = ["integration: requires a real isolated PostgreSQL database"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]

[tool.uv]
required-version = "==0.12.23"
